<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Shunmo 顺墨 seal: vermilion rounded-square chop with white carved 墨 (ink) -->
  <defs>
    <filter id="wear" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.98  0 0 0 0 0.95  0 0 0 0 0.9  0 0 0 0.03 0" result="grain"/>
      <feComposite in="grain" in2="SourceGraphic" operator="atop"/>
    </filter>
  </defs>
  <g filter="url(#wear)">
    <rect x="24" y="24" width="464" height="464" rx="104" fill="#C8442C"/>
    <rect x="56" y="56" width="400" height="400" rx="84" fill="none" stroke="#FDFBF5" stroke-opacity="0.55" stroke-width="10"/>
    <text x="256" y="262" text-anchor="middle" dominant-baseline="central"
          font-family="'Ma Shan Zheng','Noto Serif CJK SC','Songti SC',serif"
          font-size="300" fill="#FDFBF5" transform="rotate(-2 256 256)">墨</text>
  </g>
</svg>
